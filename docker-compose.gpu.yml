# NVIDIA GPU for Gazebo rendering (gpu_lidar, GUI).  Requires the NVIDIA Container Toolkit.
#   ./scripts/start.sh --gpu        (= docker compose -f docker-compose.yml -f docker-compose.gpu.yml ...)
x-gpu: &gpu
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  sim:
    <<: *gpu
  gui:
    <<: *gpu
  rviz:
    <<: *gpu
